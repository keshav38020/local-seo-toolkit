<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local SEO Toolkit | MediaOfficers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="animate-in">
            <h1>Local SEO <span class="accent">Toolkit</span></h1>
            <p>Zero-Dependency Technical SEO Utility by MediaOfficers</p>
        </header>

        <div class="card animate-in">
            <h3>JSON-LD Schema Generator</h3>
            <p class="subtitle">Generate valid structured data instantly.</p>
            
           <div class="form-group">
                <label>Select Schema Type</label>
                <select id="schemaType" onchange="toggleFields()">
                    <option value="local">Local Business</option>
                    <option value="faq">FAQ Page</option>
                    <option value="article">Article / Blog Post</option>
                    <option value="product">Product</option>
                    <option value="event">Event</option>
                </select>
            </div>

            <!-- Dynamic Fields Container -->
            <div id="dynamicFields">
                <!-- Injected by JS -->
            </div>

            <div class="output-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <label style="margin: 0;">Generated JSON-LD</label>
                </div>
                <pre id="output">{"status": "Waiting for input..."}</pre>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="btn" onclick="copyCode()">Copy Code</button>
                    <a href="https://search.google.com/test/rich-results" target="_blank" class="btn btn-secondary" style="text-align: center; text-decoration: none;">Test in Google</a>
                </div>
            </div>
        </div>
    </div>

    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
